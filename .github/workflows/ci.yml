name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install FFmpeg for local media fixture tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: |
          touch .env
          docker compose config --quiet
      - name: Build production image
        run: docker build --tag iona:ci .
      - name: Build separate highlight worker image
        run: docker build --file Dockerfile.highlights --tag iona-highlights:ci .
      - name: Verify highlight worker stays disabled without configuration
        run: docker run --rm iona-highlights:ci
      - name: Check production dependencies and command loading
        run: >-
          docker run --rm iona:ci node -e
          "for (const name of ['discord.js', 'dotenv', 'express', 'mongodb', 'mongoose', 'node-cron']) require(name);
          const { Collection } = require('discord.js');
          const client = { commands: new Collection() };
          require('./src/core/moduleLoader').loadModules(client);
          const command = require('./src/commands/dice');
          if (command.data.toJSON().name !== 'dice') throw new Error('Dice command failed to load');"
